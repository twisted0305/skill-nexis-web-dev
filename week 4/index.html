<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatTask - Conversational To-Do</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <main class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-left">
        <div class="avatar-status">
          <div class="avatar">⚡</div>
          <span class="online-indicator"></span>
        </div>
        <div class="header-titles">
          <h1 class="app-title">TaskFlow Chat</h1>
          <p class="app-subtitle" id="taskStats">Loading tasks...</p>
        </div>
      </div>

      <!-- Filter Controls -->
      <nav class="filter-group" aria-label="Task Filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Done</button>
      </nav>
    </header>

    <!-- Chat Message / Task Stream -->
    <section class="chat-feed" id="chatFeed" aria-live="polite">
      <!-- Tasks will be rendered dynamically here -->
    </section>

    <!-- Input Action Bar -->
    <footer class="app-footer">
      <form id="taskForm" class="task-form">
        <div class="input-wrapper">
          <input
            type="text"
            id="taskInput"
            class="task-input"
            placeholder="Type a new task and hit Enter..."
            autocomplete="off"
            required
          />
        </div>
        <button type="submit" class="send-btn" id="sendBtn" title="Send Task">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
          <span class="sr-only">Send</span>
        </button>
      </form>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
