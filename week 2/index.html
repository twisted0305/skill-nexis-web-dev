<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Digital Clock & Countdown</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <section class="clock-card">

            <p class="label">CURRENT TIME</p>

            <h1 id="clock">00:00:00</h1>

            <p id="date">Loading date...</p>

        </section>


        <section class="countdown-card">

            <p class="label">COUNTDOWN</p>

            <h2>New Year 2027</h2>

            <div class="countdown">

                <div class="time-box">
                    <span id="days">00</span>
                    <small>Days</small>
                </div>

                <div class="time-box">
                    <span id="hours">00</span>
                    <small>Hours</small>
                </div>

                <div class="time-box">
                    <span id="minutes">00</span>
                    <small>Minutes</small>
                </div>

                <div class="time-box">
                    <span id="seconds">00</span>
                    <small>Seconds</small>
                </div>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
